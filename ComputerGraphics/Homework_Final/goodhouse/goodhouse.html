            function computeSceneBounds() {
                console.log('🔎 computeSceneBounds called — using mesh-only traversal with height filter');
                const box = new THREE.Box3();
                if (loadedModels.length === 0) {
                    // 默认范围
                    box.setFromCenterAndSize(new THREE.Vector3(0, 0, 0), new THREE.Vector3(10, 10, 10));
                    return box;
                }

                // 仅基于网格(Mesh)来计算边界，排除相机、灯光或其他非几何体对象，且过滤掉过高的网格
                loadedModels.forEach(m => {
                    m.traverse(child => {
                        if (child.isMesh) {
                            try {
                                // 计算该mesh的世界包围盒
                                const meshBox = new THREE.Box3().setFromObject(child);
                                // 如果mesh的最高点超过50单位，跳过（过滤异常高位置的几何体）
                                if (meshBox.max.y <= 50) {
                                    box.expandByObject(child);
                                } else {
                                    console.log(`⚠ 跳过高位置网格: ${child.name || 'unnamed'} | max.y: ${meshBox.max.y.toFixed(2)}`);
                                }
                            } catch (e) {
                                // 某些几何体可能缺少 geometry，这里保护性捕获
                            }
                        }
                    });
                });

                // 如果没有任何网格，回退到默认范围
                if (box.isEmpty()) box.setFromCenterAndSize(new THREE.Vector3(0, 0, 0), new THREE.Vector3(10, 10, 10));
                return box;
            }

            function enterTopDown() {
                savedCameraPosition = camera.position.clone();
                savedControlsTarget = controls.target.clone();
                savedCameraUp = camera.up.clone();

                const box = computeSceneBounds();
                const center = new THREE.Vector3();
                const size = new THREE.Vector3();
                box.getCenter(center);
                box.getSize(size);

                // 计算每个已加载模型的包围盒并输出，帮助定位哪个模型导致尺寸异常
                let maxModelY = 0;
                loadedModels.forEach(m => {
                    try {
                        const mb = new THREE.Box3().setFromObject(m);
                        const msize = new THREE.Vector3();
                        const mcenter = new THREE.Vector3();
                        mb.getSize(msize);
                        mb.getCenter(mcenter);
                        console.log(`📦 模型边界: ${m.name || '(unnamed)'} | center: (${mcenter.x.toFixed(2)}, ${mcenter.y.toFixed(2)}, ${mcenter.z.toFixed(2)}) | size: (${msize.x.toFixed(2)}, ${msize.y.toFixed(2)}, ${msize.z.toFixed(2)})`);
                        if (msize.y > maxModelY) maxModelY = msize.y;
                    } catch (e) {
                        console.warn('⚠ 无法计算模型包围盒:', m.name, e);
                    }
                });

                // 基于整体尺寸计算高度，但对单个异常模型做上限保护
                const rawHeight = Math.max(size.y * 1.5, 6);
                const cap = Math.max(60, maxModelY * 3); // 最小上限 60 或根据最大模型高度动态决定
                const height = Math.min(rawHeight, cap);

                // 使用手动调整的最佳俯视视角
                camera.position.set(5.61, 26.64, -24.06);
                camera.quaternion.set(-0.5031, -0.4969, -0.4969, 0.5031);
                camera.up.set(0.00, 1.00, 0.00);
                controls.target.set(5.61, 6.56, -24.06);
                controls.update();
                // 重新设置四元数，因为 controls.update() 会覆盖它
                camera.quaternion.set(-0.5031, -0.4969, -0.4969, 0.5031);

                // 启用平面视角（默认一楼高度）
                setPlaneHeight(5.3);
                const controlsPanel = document.getElementById('planeViewControls');
                if (controlsPanel) controlsPanel.style.display = 'block';

                const btn = document.getElementById('togglePlaneViewBtn');
                if (btn) { btn.textContent = '🔼 退出俯视'; btn.style.background = '#4a90d9'; }
                topDownMode = true;
            }

            function exitTopDown() {
                if (savedCameraPosition) camera.position.copy(savedCameraPosition);
                if (savedControlsTarget) controls.target.copy(savedControlsTarget);
                if (savedCameraUp) camera.up.copy(savedCameraUp);
                controls.update();

                // 禁用平面视角
                disableClipping();
                const controlsPanel = document.getElementById('planeViewControls');
                if (controlsPanel) controlsPanel.style.display = 'none';

                const btn = document.getElementById('togglePlaneViewBtn');
                if (btn) { btn.textContent = '📐 平面视角'; btn.style.background = '#2a7a2a'; }
                topDownMode = false;
            }

            const btn = document.getElementById('togglePlaneViewBtn');
            if (btn) {
                btn.addEventListener('click', () => {
                    try {
                        if (!topDownMode) enterTopDown(); else exitTopDown();
                    } catch (e) {
                        console.error('切换俯视失败:', e);
                    }
                });
            }
        })();

        // 设置平面高度
        function setPlaneHeight(height) {
            // 更新裁剪平面（使用负值与向上法线配合表示高度）
            clippingPlane.constant = -height;

            // 归一化法线以防变换带来缩放
            clippingPlane.normal.normalize();

            // 应用裁剪到所有模型
            enableClipping();
            
            // 更新UI
            document.getElementById('planeHeightValue').textContent = height.toFixed(2);
            const slider = document.getElementById('planeHeightSlider');
            slider.value = height;
            
            console.log(`✓ 切割平面高度: ${height.toFixed(2)}`);
        }

        // 启用裁剪
        function enableClipping() {
            // 使用反向平面（确保显示平面下方的几何体）并同时设置 renderer 的全局裁剪平面
            const appliedPlane = clippingPlane.clone().negate();
            console.log('启用裁剪: plane normal=', appliedPlane.normal.toArray(), 'constant=', appliedPlane.constant);

            // 记录各模型的边界高度，帮助排查裁剪方向问题
            loadedModels.forEach(model => {
                const box = new THREE.Box3().setFromObject(model);
                const minY = box.min.y;
                const maxY = box.max.y;
                console.log(`模型: ${model.name || model.userData?.config?.name || '(unnamed)'} | minY=${minY.toFixed(2)} maxY=${maxY.toFixed(2)}`);
            });

            // 将裁剪平面应用到每个材质
            loadedModels.forEach(model => {
                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        materials.forEach(mat => {
                            mat.clippingPlanes = [appliedPlane];
                            mat.clipShadows = true;
                            mat.needsUpdate = true;
                        });
                    }
                });
            });

            // 同时设置 renderer 的全局裁剪平面，作为保护措施使新创建的材质也受影响
            try {
                renderer.clippingPlanes = [appliedPlane];
            } catch (e) {
                console.warn('无法设置 renderer.clippingPlanes:', e);
            }
        }

        // 禁用裁剪
        function disableClipping() {
            loadedModels.forEach(model => {
                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        materials.forEach(mat => {
                            mat.clippingPlanes = [];
                            mat.needsUpdate = true;
                        });
                    }
                });
            });
            // 清除 renderer 全局裁剪平面
            try { renderer.clippingPlanes = []; } catch (e) { /* ignore */ }
        }

        // 切换自定义高度控制
        function toggleCustomHeight() {
            customHeightMode = !customHeightMode;
            const control = document.getElementById('customHeightControl');
            control.style.display = customHeightMode ? 'block' : 'none';
            
            if (customHeightMode) {
                console.log('✓ 自定义高度模式已启用');
            }
        }

        // ==========================================
        // 活动轨迹热力图系统（轻量实现）
        // - 删除原有静态/模拟热力图，改为实时记录第一视角位置并在 UI 画布上渲染
        // - 会尝试根据场景中名为 "wall" 的网格构建多边形遮罩，若失败则使用房子边界矩形
        // ==========================================
        let activityHeatmapCanvas = null;
        let activityHeatmapCtx = null;
        let activityPositions = []; // 存储 Vector3
        let activityMode = false;
        let lastRecordTime = 0;
        const RECORD_INTERVAL = 0.12; // 秒

        // 初始化 UI（调用时会找到已在 DOM 中预先创建的 canvas）
        // 新版热力图：使用外部图片作为背景，并在固定世界矩形范围内把世界坐标映射到图片/画布坐标
        let heatmapBgImage = null;
        let heatmapImageReady = false;
        let heatmapWorldBounds = null; // { minX, maxX, minZ, maxZ, width, depth }
        // 栅格累积（性能友好）：使用较低分辨率网格累加访问次数
        const HEATMAP_GRID_W = 512;
        const HEATMAP_GRID_H = 512;
        let heatmapGrid = new Float32Array(HEATMAP_GRID_W * HEATMAP_GRID_H);
        let heatmapMaxValue = 0;

        function initActivityHeatmapUI() {
            activityHeatmapCanvas = document.getElementById('activityHeatmapCanvas');
            if (!activityHeatmapCanvas) return;
            activityHeatmapCtx = activityHeatmapCanvas.getContext('2d');

            document.getElementById('activityHeatmapClearBtn').addEventListener('click', () => {
                activityPositions.length = 0;
                heatmapGrid.fill(0);
                heatmapMaxValue = 0;
                clearHeatmapCanvas();
            });
            document.getElementById('activityHeatmapExportBtn').addEventListener('click', () => {
                if (!activityHeatmapCanvas) return;
                const dataUrl = activityHeatmapCanvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = 'activity_heatmap.png';
                a.click();
            });
            document.getElementById('activityHeatmapOpacity').addEventListener('input', (e) => {
                activityHeatmapCanvas.style.opacity = e.target.value;
            });

            // 尝试加载背景图片（workspace 根目录下的 image.png）
            heatmapBgImage = new Image();
            heatmapBgImage.src = 'image.png';
            heatmapBgImage.onload = () => {
                heatmapImageReady = true;
                console.log('热力图背景图片已加载: ', heatmapBgImage.naturalWidth, 'x', heatmapBgImage.naturalHeight);
                // 将热力图画布像素尺寸设置为图片原始尺寸，避免压缩
                if (activityHeatmapCanvas) {
                    activityHeatmapCanvas.width = heatmapBgImage.naturalWidth;
                    activityHeatmapCanvas.height = heatmapBgImage.naturalHeight;
                    // 同步 CSS 尺寸为图片像素（可改为固定显示或保持100%宽度，如果想缩放请保留100%）
                    activityHeatmapCanvas.style.width = heatmapBgImage.naturalWidth + 'px';
                    activityHeatmapCanvas.style.height = heatmapBgImage.naturalHeight + 'px';
                }
                renderActivityHeatmapCanvas();
            };
            heatmapBgImage.onerror = () => {
                heatmapImageReady = false;
                console.warn('无法加载热力图背景图片 image.png，继续使用纯色背景');
            };
        }

        // 切换热力图显示（在 UI 按钮中调用）
        function toggleActivityHeatmap() {
            activityMode = !activityMode;
            const controls = document.getElementById('activityHeatmapControls');
            if (controls) {
                controls.style.display = activityMode ? 'block' : 'none';
                if (activityMode) {
                    controls.style.width = '256px';
                } else {
                    controls.style.width = '';
                }
            }
            const btn = document.getElementById('activityHeatmapBtn');
            if (btn) btn.style.opacity = activityMode ? '0.7' : '1';
            if (activityMode) {
                activityPositions.length = 0;
                lastRecordTime = performance.now() / 1000;
                initActivityHeatmapUI();
                // 默认使用你提供的两个世界坐标作为热力图边界（可在运行时用其它值覆盖）
                // 点1: x=-6.323, z=-41.231  点2: x=14.638, z=-5.038
                setHeatmapWorldBoundsFromCorners(-6.323, -41.231, 14.638, -5.038);
                console.log('✓ 活动轨迹热力图已启用（使用预设世界边界）');
            } else {
                console.log('✓ 活动轨迹热力图已关闭');
            }
        }

        function clearHeatmapCanvas() {
            if (!activityHeatmapCtx) return;
            activityHeatmapCtx.clearRect(0, 0, activityHeatmapCanvas.width, activityHeatmapCanvas.height);
        }

        // 由外部调用：用两个世界坐标角点来设置热力图世界边界
        function setHeatmapWorldBoundsFromCorners(x1, z1, x2, z2) {
            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const minZ = Math.min(z1, z2);
            const maxZ = Math.max(z1, z2);
            heatmapWorldBounds = {
                minX, maxX, minZ, maxZ,
                width: Math.max(0.0001, maxX - minX),
                depth: Math.max(0.0001, maxZ - minZ)
            };
            console.log('设置热力图世界边界:', heatmapWorldBounds);
            // 重置栅格
            heatmapGrid = new Float32Array(HEATMAP_GRID_W * HEATMAP_GRID_H);
            heatmapMaxValue = 0;
        }

        // 在 animate 中调用：记录第一视角位置（若处于记录状态）
        function recordActivityPositionIfNeeded(nowSec) {
            if (!activityMode) return;
            if (!firstPersonMode) return; // 仅记录第一视角下的位置
            if (nowSec - lastRecordTime < RECORD_INTERVAL) return;
            lastRecordTime = nowSec;
            const pos = camera.position.clone();
            activityPositions.push(pos);

            // 同步到栅格
            if (heatmapWorldBounds) {
                const u = (pos.x - heatmapWorldBounds.minX) / heatmapWorldBounds.width;
                const v = (pos.z - heatmapWorldBounds.minZ) / heatmapWorldBounds.depth;
                // 允许超出边界但丢弃
                if (u >= 0 && u <= 1 && v >= 0 && v <= 1) {
                    const gx = Math.floor(u * (HEATMAP_GRID_W - 1));
                    const gy = Math.floor(v * (HEATMAP_GRID_H - 1));
                    const idx = gy * HEATMAP_GRID_W + gx;
                    heatmapGrid[idx] += 1.0;
                    if (heatmapGrid[idx] > heatmapMaxValue) heatmapMaxValue = heatmapGrid[idx];
                }
            }

            // 同步渲染到画布（轻量刷新）
            renderActivityHeatmapCanvas();
        }

        // 将世界坐标转换为画布坐标（基于 heatmapWorldBounds 与图片/画布尺寸）
        function worldToCanvasXY_usingImage(x, z, canvas) {
            if (!heatmapWorldBounds) return null;
            const u = (x - heatmapWorldBounds.minX) / heatmapWorldBounds.width;
            const v = (z - heatmapWorldBounds.minZ) / heatmapWorldBounds.depth;
            // 图像坐标
            const imgW = heatmapBgImage && heatmapImageReady ? heatmapBgImage.naturalWidth : canvas.width;
            const imgH = heatmapBgImage && heatmapImageReady ? heatmapBgImage.naturalHeight : canvas.height;
            const imgX = u * imgW;
            const imgY = v * imgH;
            // 映射到画布尺寸（图片会被拉伸填充到 canvas）
            const cx = (imgX / imgW) * canvas.width;
            const cy = (imgY / imgH) * canvas.height;
            return { x: Math.round(cx), y: Math.round(cy) };
        }

        // 渲染热力图到 UI 画布（使用背景图 + 栅格累加）
        function renderActivityHeatmapCanvas() {
            if (!activityHeatmapCtx || !activityHeatmapCanvas) return;
            const canvas = activityHeatmapCanvas;
            const ctx = activityHeatmapCtx;
            // 清除并绘制背景图
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (heatmapBgImage && heatmapImageReady) {
                // 拉伸图片填满画布
                ctx.drawImage(heatmapBgImage, 0, 0, canvas.width, canvas.height);
            } else {
                // 备用浅色背景
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 绘制热度层到离屏画布（仅热度层，不包含背景），以便只对热度做模糊处理
            const heatLayer = document.createElement('canvas');
            heatLayer.width = canvas.width; heatLayer.height = canvas.height;
            const hctx = heatLayer.getContext('2d');
            hctx.clearRect(0, 0, heatLayer.width, heatLayer.height);
            hctx.globalCompositeOperation = 'lighter';
            for (let gy = 0; gy < HEATMAP_GRID_H; gy++) {
                for (let gx = 0; gx < HEATMAP_GRID_W; gx++) {
                    const val = heatmapGrid[gy * HEATMAP_GRID_W + gx];
                    if (!val) continue;
                    const t = Math.min(1, val / Math.max(1, heatmapMaxValue));
                    const cx = (gx + 0.5) / HEATMAP_GRID_W * heatLayer.width;
                    const cy = (gy + 0.5) / HEATMAP_GRID_H * heatLayer.height;
                    const radius = Math.max(8, Math.min(heatLayer.width, heatLayer.height) * 0.03);
                    const grd = hctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                    const a = Math.min(0.9, 0.25 + t * 0.75);
                    grd.addColorStop(0, `rgba(255,${Math.round(200 - 150 * t)},0,${a})`);
                    grd.addColorStop(0.5, `rgba(255,${Math.round(120 - 100 * t)},0,${a * 0.6})`);
                    grd.addColorStop(1, 'rgba(255,255,255,0)');
                    hctx.fillStyle = grd;
                    hctx.beginPath();
                    hctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    hctx.fill();
                }
            }

            // 模糊热度层（生成模糊的热力贴图），保留背景清晰
            const blurred = document.createElement('canvas');
            blurred.width = heatLayer.width; blurred.height = heatLayer.height;
            const bctx = blurred.getContext('2d');
            // 使用 Canvas2D 的 filter（若不支持会回退为无模糊）
            bctx.filter = 'blur(6px)';
            bctx.drawImage(heatLayer, 0, 0);

            // 将背景绘制到主画布，然后把模糊的热度层以叠加模式绘上去
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (heatmapBgImage && heatmapImageReady) {
                ctx.drawImage(heatmapBgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.globalCompositeOperation = 'lighter';
            ctx.drawImage(blurred, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
        }

        // 键盘控制平面高度
        window.addEventListener('keydown', (e) => {
            if (!topDownMode || !customHeightMode) return;
            
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
                
                const slider = document.getElementById('planeHeightSlider');
                let currentHeight = parseFloat(slider.value);
                const step = 0.1;
                
                if (e.key === 'ArrowUp') {
                    currentHeight = Math.min(parseFloat(slider.max), currentHeight + step);
                } else {
                    currentHeight = Math.max(parseFloat(slider.min), currentHeight - step);
                }
                
                setPlaneHeight(currentHeight);
            }
        });

        // ==========================================
        // 7. 渲染循环 (符合：性能 > 25 fps)
        // ==========================================
        // FPS 计算变量
        let lastTime = performance.now();
        let frames = 0;
        let fps = 60;
        const fpsElement = document.getElementById('fpsValue');
        const fpsMonitorElement = document.getElementById('fpsMonitor');
        
        function animate() {
            requestAnimationFrame(animate);

            // 处理连续的WASD移动
            if (keysPressed.w || keysPressed.a || keysPressed.s || keysPressed.d) {
                if (firstPersonMode) {
                    // 第一视角移动由后面的 fpMove + 速度逻辑处理，这里不再直接设置 pointerLockControls 属性
                } else {
                    // 普通视角：移动相机和target
                    // 计算移动距离：基于视口大小的固定比例（每帧0.5%）
                    const moveDistance = Math.max(window.innerWidth, window.innerHeight) * 0.00005;
                    
                    // 获取相机的方向向量
                    const cameraRight = new THREE.Vector3();
                    camera.getWorldDirection(cameraRight);
                    cameraRight.cross(camera.up).normalize();
                    
                    const offset = new THREE.Vector3();
                    
                    if (keysPressed.w) { // 向前
                        const forward = new THREE.Vector3();
                        camera.getWorldDirection(forward);
                        forward.y = 0;
                        forward.normalize().multiplyScalar(moveDistance);
                        offset.add(forward);
                    }
                    if (keysPressed.s) { // 向后
                        const backward = new THREE.Vector3();
                        camera.getWorldDirection(backward);
                        backward.y = 0;
                        backward.normalize().multiplyScalar(-moveDistance);
                        offset.add(backward);
                    }
                    if (keysPressed.a) { // 向左
                        const left = cameraRight.clone();
                        left.y = 0;
                        left.normalize().multiplyScalar(-moveDistance);
                        offset.add(left);
                    }
                    if (keysPressed.d) { // 向右
                        const right = cameraRight.clone();
                        right.y = 0;
                        right.normalize().multiplyScalar(moveDistance);
                        offset.add(right);
                    }
                    
                    // 应用移动
                    controls.target.add(offset);
                    camera.position.add(offset);
                }
            } else if (firstPersonMode) {
                // 没有按键时重置移动状态（由 fpMove 管理）
                fpMove.forward = fpMove.backward = fpMove.left = fpMove.right = false;
                fpVelocity.set(0, 0, 0);
            }

            // 如果有骨骼动画 mixer，在这里 update
            // if (mixer) mixer.update(clock.getDelta());

            if (!firstPersonMode) {
                controls.update();
                // 在俯视模式下强制设置相机四元数
                if (topDownMode) {
                    camera.quaternion.set(-0.5031, -0.4969, -0.4969, 0.5031);
                }
            } else {
                // 第一视角手动更新移动（PointerLockControls 负责鼠标视角）
                const delta = fpClock.getDelta();

                // 目标方向（基于摄像机朝向）
                fpDirection.set(0, 0, 0);
                if (fpMove.forward) fpDirection.z -= 1;
                if (fpMove.backward) fpDirection.z += 1;
                if (fpMove.left) fpDirection.x -= 1;
                if (fpMove.right) fpDirection.x += 1;

                if (fpDirection.lengthSq() > 0) fpDirection.normalize();

                // 使用摄像机朝向计算移动方向（避免Euler符号或坐标系问题）
                const forwardVec = new THREE.Vector3();
                camera.getWorldDirection(forwardVec);
                forwardVec.y = 0;
                forwardVec.normalize();
                const rightVec = new THREE.Vector3();
                rightVec.crossVectors(forwardVec, camera.up).normalize();

                const moveVec = new THREE.Vector3();
                if (fpMove.forward) moveVec.add(forwardVec);
                if (fpMove.backward) moveVec.sub(forwardVec);
                if (fpMove.right) moveVec.add(rightVec);
                if (fpMove.left) moveVec.sub(rightVec);

                if (moveVec.lengthSq() > 0) moveVec.normalize();

                // 速度逼近目标速度（阻尼）
                const targetVel = moveVec.multiplyScalar(FP_SPEED);
                fpVelocity.lerp(targetVel, Math.min(1, FP_DAMPING * delta));

                // 应用位移（基于 pointerLockControls 管理的对象）
                pointerLockControls.getObject().position.addScaledVector(fpVelocity, delta);
                // 将 pointerLockControls 的位置同步到 camera，供渲染使用
                camera.position.copy(pointerLockControls.getObject().position);
            }
            // 记录活动轨迹（若启用）并更新热力图画布
            const nowSec = performance.now() / 1000;
            recordActivityPositionIfNeeded(nowSec);
            // 更新第一视角仪表盘
            updateDashboard();
            renderer.render(scene, camera);
            
            // 更新FPS
            frames++;
            const currentTime = performance.now();
            const elapsed = currentTime - lastTime;
            
            if (elapsed >= 1000) { // 每秒更新一次FPS显示
                fps = Math.round((frames * 1000) / elapsed);
                fpsElement.textContent = fps;
                
                // 根据FPS改变颜色
                if (fps >= 50) {
                    fpsElement.style.color = '#0f0'; // 绿色 - 良好
                    fpsMonitorElement.style.borderColor = 'rgba(0, 255, 0, 0.3)';
                    fpsMonitorElement.style.boxShadow = '0 0 10px rgba(0, 255, 0, 0.2)';
                } else if (fps >= 30) {
                    fpsElement.style.color = '#ff0'; // 黄色 - 一般
                    fpsMonitorElement.style.borderColor = 'rgba(255, 255, 0, 0.3)';
                    fpsMonitorElement.style.boxShadow = '0 0 10px rgba(255, 255, 0, 0.2)';
                } else {
                    fpsElement.style.color = '#f00'; // 红色 - 较差
                    fpsMonitorElement.style.borderColor = 'rgba(255, 0, 0, 0.3)';
                    fpsMonitorElement.style.boxShadow = '0 0 10px rgba(255, 0, 0, 0.2)';
                }
                
                frames = 0;
                lastTime = currentTime;
            }
        }

        animate();

        // ==========================================
        // 8. 窗口自适应
        // ==========================================
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
