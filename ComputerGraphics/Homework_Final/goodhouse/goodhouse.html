<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好房子三维可视化系统 - WebGL大作业</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: '微软雅黑', sans-serif;
            pointer-events: none; /* 让鼠标事件穿透文字 */
            text-shadow: 1px 1px 2px black;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-family: sans-serif;
            display: none; /* 默认隐藏，加载开始时显示 */
        }
        #fpsMonitor {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            min-width: 80px;
            text-align: center;
            border: 1px solid rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        #fpsMonitor .label {
            font-size: 12px;
            color: #999;
            display: block;
            margin-bottom: 2px;
        }
    </style>
    <!-- 引入 Three.js 和 FBXLoader -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <!-- 热力图旧配置文件已移除 -->
</head>
<body>
    <div id="info">
        <h2>"好房子"三维可视化系统</h2>
        <p>操作说明：左键旋转 | 右键平移 | 滚轮缩放 | <span style="color:#00ffff">WASD键移动镜头</span> | <span style="color:#ff00ff">V键切换第一视角</span></p>
        <p style="color: #ffff00; font-size: 0.9em;">📝 编辑模式：点击模型选中 | W:移动 | E:旋转 | R:缩放 | Delete:删除 | Esc:取消选中</p>
        <p style="color: #00ff00; font-size: 0.85em;">🔀 Tab键:切换选择模式 | <span id="selectionMode">单个家具</span> | ⚡已启用模型缓存优化</p>
    </div>
    <div id="loading">正在加载模型... 0%</div>
    
    <!-- FPS监控器 -->
    <div id="fpsMonitor">
        <span class="label">FPS</span>
        <span id="fpsValue">60</span>
    </div>
    
    <!-- 模型选择面板 -->
    <div id="modelPanel" style="position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.7);padding:12px;border-radius:8px;color:#fff;z-index:200;font-family:sans-serif;max-height:80vh;overflow-y:auto;">
        <h3 style="margin:0 0 10px 0;font-size:14px;">📦 模型库</h3>
        <div id="modelList" style="display:flex;flex-direction:column;gap:6px;"></div>
        <hr style="border-color:#555;margin:10px 0;">
        <div style="font-size:12px;color:#aaa;">
            <p style="margin:4px 0;">点击按钮添加模型到场景</p>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { TextureLoader } from 'three';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // ==========================================
        // 1. 基础场景初始化 (符合：基础3D场景构建)
        // ==========================================
        const scene = new THREE.Scene();
        
        // 创建渐变天空背景（程序化生成，性能友好）
        const vertexShader = `
            varying vec3 vWorldPosition;
            void main() {
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        
        const fragmentShader = `
            uniform vec3 topColor;
            uniform vec3 bottomColor;
            uniform float offset;
            uniform float exponent;
            varying vec3 vWorldPosition;
            
            void main() {
                float h = normalize(vWorldPosition + offset).y;
                gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
            }
        `;
        
        const skyGeo = new THREE.SphereGeometry(500, 32, 15);
        const skyMat = new THREE.ShaderMaterial({
            uniforms: {
                topColor: { value: new THREE.Color(0x87ceeb) },      // 天蓝色
                bottomColor: { value: new THREE.Color(0xffffff) },   // 白色（地平线）
                offset: { value: 33 },
                exponent: { value: 0.6 }
            },
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            side: THREE.BackSide
        });
        
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);
        
        // 添加雾效，与天空颜色匹配
        scene.fog = new THREE.Fog(0xd4e9f7, 10, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5); // 设置相机初始位置

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // 开启抗锯齿和alpha
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 开启阴影渲染 (符合：正确呈现基本遮挡)
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 软阴影
        renderer.sortObjects = true; // 确保对象按深度排序渲染
        renderer.localClippingEnabled = true; // 启用局部裁剪平面
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. 光照系统 (符合：基础光照 - Blinn-Phong模型)
        // ==========================================
        // 环境光：照亮暗部
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5); 
        scene.add(ambientLight);

        // 平行光：模拟太阳，产生阴影
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0); // 强度2.0
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true; // 产生阴影

        // 优化阴影参数（避免阴影锯齿）
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 50;
        scene.add(dirLight);

        // ==========================================
        // 3. 基础几何体 (保底方案)
        // ==========================================
        
        // 地板 (Ground)
        const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshPhongMaterial({ color: 0x999999, depthWrite: false }) // 使用 Phong 材质
        );
        mesh.rotation.x = -Math.PI / 2;
        mesh.receiveShadow = true; // 接收阴影
        scene.add(mesh);

        // 参考网格 (GridHelper) - 方便你看坐标
        const grid = new THREE.GridHelper(100, 100, 0x000000, 0x000000);
        grid.material.opacity = 0.2;
        grid.material.transparent = true;
        scene.add(grid);


        // ==========================================
        // 4. 多模型加载系统
        // ==========================================
        
        // 全局变量
        let topDownMode = false; // 俯视模式状态

        // 环境传感器基准值和抖动范围
        let tempBase = 28.0;
        let humBase = 50;
        let pmBase = 20;
        const tempNoiseRange = 0.9;
        const humNoiseRange = 1;
        const pmNoiseRange = 5;

        // 缓存的随机噪声（每秒更新）
        let lastSecond = 0;
        let cachedTempNoise = 0;
        let cachedHumNoise = 0;
        let cachedPmNoise = 0;

        // 模型配置列表 - 在这里添加你的模型
        // 每个模型一个文件夹，包含 fbx 文件和 textures 子文件夹
        const modelConfigs = [
            {
                name: '家具套装',
                folder: 'model/source',           // 模型所在文件夹
                file: 'allirassettar.fbx',        // FBX文件名
                textureFolder: 'model/textures',  // 纹理文件夹
                scale: 0.01,                      // 缩放比例
                position: [0, 0, 0]               // 默认位置
            },
            {
                name: '房子',
                folder: 'model/source',
                file: 'Modern House.fbx',
                textureFolder: 'model/textures',
                scale: 0.001,
                position: [-2, 0, 0]
            },
            {
                name: '空调',
                folder: 'model/source',
                file: 'low.fbx',
                textureFolder: 'model/textures',
                scale: 0.01,
                position: [-4, 0, 0]
            },
            {
                name: '电视',
                folder: 'model/source',
                file: 'TV.fbx',
                textureFolder: 'model/textures',
                scale: 0.01,
                position: [-6, 0, 0]
            },
            {
                name: '床',
                folder: 'model/source',
                file: 'Bed.fbx',
                textureFolder: 'model/textures',
                scale: 0.01,
                position: [0, 0, 0]
            }
        ];

        // 已加载的模型列表
        const loadedModels = [];
        let loadedModel = null; // 保持兼容性，指向最后加载的模型

        // 模型缓存系统 - 避免重复加载相同的FBX文件
        const modelCache = new Map(); // key: modelPath, value: loaded FBX object
        const textureCache = new Map(); // key: texturePath, value: loaded texture
        
        // 调试模式开关（关闭可提升性能）
        const DEBUG_MODE = false;

        // 创建纹理加载器
        const textureLoader = new THREE.TextureLoader();
        const loader = new FBXLoader();
        const loadingElem = document.getElementById('loading');
        
        // 通用模型加载函数（带缓存优化）
        async function loadModel(config, addToScene = true, skipDefaultTransform = false) {
            const modelPath = `${config.folder}/${config.file}`;
            const textureFolder = config.textureFolder || config.folder + '/textures';
            
            loadingElem.style.display = 'block';
            loadingElem.innerText = `正在加载: ${config.name}...`;
            
            // 检查缓存，如果已加载过相同的模型，直接克隆
            if (modelCache.has(modelPath)) {
                if (DEBUG_MODE) console.log(`♻️ 从缓存克隆模型: ${config.name}`);
                const cachedModel = modelCache.get(modelPath);
                const object = cachedModel.clone();
                
                // 克隆材质，避免共享材质导致的问题
                object.traverse((child) => {
                    if (child.isMesh && child.material) {
                        if (Array.isArray(child.material)) {
                            child.material = child.material.map(m => m.clone());
                        } else {
                            child.material = child.material.clone();
                        }
                    }
                });
                
                // 设置名称和用户数据
                object.name = config.name || config.file;
                object.userData.config = config;
                
                // 应用变换
                if (!skipDefaultTransform) {
                    const scale = config.scale || 0.01;
                    object.scale.set(scale, scale, scale);
                    if (config.position) {
                        object.position.set(...config.position);
                    }
                }
                
                if (addToScene) {
                    scene.add(object);
                    loadedModels.push(object);
                    loadedModel = object;
                }
                
                loadingElem.style.display = 'none';
                return object;
            }
            
            // 如果缓存中没有，则加载模型
            return new Promise((resolve, reject) => {
                const manager = new THREE.LoadingManager();
                
                loadTextureListForModel(textureFolder).then(textures => {
                    if (DEBUG_MODE) console.log(`📁 纹理文件夹 "${textureFolder}" 包含 ${textures.length} 个纹理文件`);
                    
                    // 设置纹理路径修改器 - 改进版智能匹配
                    manager.setURLModifier((url) => {
                        const fileName = url.split('/').pop().split('\\').pop();
                        
                        // 处理 KTX 文件：尝试找到对应的 PNG/JPG 替代
                        if (fileName && /\.(ktx|ktx2)$/i.test(fileName)) {
                            const baseName = fileName.replace(/\.(ktx|ktx2)$/i, '').toLowerCase();
                            if (DEBUG_MODE) console.log(`🔍 查找 KTX 文件的替代纹理: "${fileName}"`);
                            
                            // 查找相似名称的 PNG/JPG 文件
                            for (const tex of textures) {
                                const texLower = tex.name.toLowerCase();
                                if (texLower.includes('wood') || texLower.includes('texture') || 
                                    baseName.includes('wood') && (texLower.includes('basecolor') || texLower.includes('diffuse'))) {
                                    if (DEBUG_MODE) console.log(`🎨 KTX 替代纹理: "${fileName}" -> "${tex.name}"`);
                                    return tex.path;
                                }
                            }
                            
                            // 如果没找到，返回一个默认纹理或原路径
                            const defaultTex = textures.find(tex => tex.name.toLowerCase().includes('basecolor'));
                            if (defaultTex) {
                                if (DEBUG_MODE) console.log(`🎨 KTX 使用默认纹理: "${fileName}" -> "${defaultTex.name}"`);
                                return defaultTex.path;
                            }
                            
                            return url; // 返回原路径，会产生 404 但不影响模型显示
                        }
                        
                        if (fileName && /\.(png|jpg|jpeg)$/i.test(fileName)) {
                            const baseName = fileName.replace(/\.(png|jpg|jpeg)$/gi, '').toLowerCase();
                            
                            // 1. 首先尝试精确匹配
                            for (const tex of textures) {
                                const texBaseName = tex.name.replace(/\.(png|jpg|jpeg|tga)$/gi, '').toLowerCase();
                                if (texBaseName === baseName || texBaseName.includes(baseName) || baseName.includes(texBaseName)) {
                                    if (DEBUG_MODE) console.log(`🎯 纹理精确匹配: "${fileName}" -> "${tex.name}"`);
                                    return tex.path;
                                }
                            }
                            
                            // 2. 模糊匹配：提取关键词进行匹配
                            const keywords = baseName.split(/[_\-\s]+/).filter(k => k.length > 2);
                            for (const tex of textures) {
                                const texLower = tex.name.toLowerCase();
                                for (const keyword of keywords) {
                                    if (texLower.includes(keyword)) {
                                        if (DEBUG_MODE) console.log(`🔍 纹理关键词匹配: "${fileName}" (${keyword}) -> "${tex.name}"`);
                                        return tex.path;
                                    }
                                }
                            }
                            
                            // 3. 如果是 BaseColor/Normal 类型，尝试匹配类型
                            const textureType = fileName.toLowerCase().includes('basecolor') ? 'basecolor' :
                                               fileName.toLowerCase().includes('normal') ? 'normal' :
                                               fileName.toLowerCase().includes('roughness') ? 'roughness' : null;
                                               
                            if (textureType) {
                                const matchedTex = textures.find(tex => tex.name.toLowerCase().includes(textureType));
                                if (matchedTex) {
                                    if (DEBUG_MODE) console.log(`🎨 纹理类型匹配: "${fileName}" (${textureType}) -> "${matchedTex.name}"`);
                                    return matchedTex.path;
                                }
                            }
                            
                            // 4. 最后返回原路径（会产生 404，但不影响模型加载）
                            return `${textureFolder}/${fileName}`;
                        }
                        return url;
                    });
                    
                    const modelLoader = new FBXLoader(manager);
                    
                    modelLoader.load(modelPath, (object) => {
                        loadingElem.style.display = 'none';
                        
                        // 设置名称
                        object.name = config.name || config.file;
                        object.userData.config = config;
                        
                        // 只有在不跳过默认变换时才应用配置中的缩放和位置
                        if (!skipDefaultTransform) {
                            // 缩放
                            const scale = config.scale || 0.01;
                            object.scale.set(scale, scale, scale);
                            
                            // 位置
                            if (config.position) {
                                object.position.set(...config.position);
                            }
                        }
                        
                        // 处理材质和阴影
                        object.traverse((child) => {
                            // 确保所有子对象可见
                            child.visible = true;
                            
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                
                                if (child.material) {
                                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                                    const newMaterials = materials.map((material, matIdx) => {
                                        // 检测并启用透明材质（窗户/玻璃）
                                        const matName = (material.name || '').toLowerCase();
                                        const childName = (child.name || '').toLowerCase();
                                        const isGlass = matName.includes('glass') || matName.includes('窗') || 
                                                       matName.includes('玻璃') || matName.includes('window') ||
                                                       matName.includes('transparent') || matName.includes('alpha') ||
                                                       childName.includes('glass') || childName.includes('窗') ||
                                                       childName.includes('玻璃') || childName.includes('window');
                                        
                                        // 如果是玻璃，创建专用的玻璃材质
                                        if (isGlass || material.opacity < 1.0 || material.transparent) {
                                            if (DEBUG_MODE) console.log(`🪟 检测到玻璃材质: ${material.name || child.name}`);
                                            
                                            // 创建玻璃专用材质 (MeshPhysicalMaterial 支持 transmission)
                                            const glassMat = new THREE.MeshPhysicalMaterial({
                                                color: 0x88ccff,           // 淡蓝色
                                                metalness: 0.0,            // 非金属
                                                roughness: 0.1,            // 光滑表面
                                                transmission: 1.0,         // 高透光率（关键！）
                                                transparent: true,
                                                opacity: 0.6,
                                                thickness: 0.5,            // 玻璃厚度
                                                ior: 1.5,                  // 折射率（玻璃约1.5）
                                                side: THREE.DoubleSide,
                                                depthWrite: false,
                                                depthTest: true,
                                            });
                                            glassMat.name = material.name || 'glass';
                                            
                                            // 设置渲染顺序
                                            child.renderOrder = 999;
                                            
                                            return glassMat;
                                        }
                                        
                                        // 非玻璃材质的正常处理
                                        material.side = THREE.DoubleSide;
                                        material.needsUpdate = true;
                                        
                                        if (material.map) {
                                            material.map.colorSpace = THREE.SRGBColorSpace;
                                        } else {
                                            // 尝试匹配纹理（带缓存）
                                            const texturePath = findTextureInList(material.name, textures);
                                            if (texturePath) {
                                                // 检查纹理缓存
                                                let texture;
                                                if (textureCache.has(texturePath)) {
                                                    texture = textureCache.get(texturePath);
                                                } else {
                                                    texture = textureLoader.load(texturePath);
                                                    texture.colorSpace = THREE.SRGBColorSpace;
                                                    texture.flipY = false;
                                                    textureCache.set(texturePath, texture);
                                                }
                                                material.map = texture;
                                            }
                                        }
                                        
                                        // 修正过暗的颜色
                                        if (material.color && material.color.r < 0.1 && material.color.g < 0.1 && material.color.b < 0.1) {
                                            material.color.setHex(0xcccccc);
                                        }
                                        
                                        return material;
                                    });
                                    
                                    // 应用新材质
                                    child.material = newMaterials.length === 1 ? newMaterials[0] : newMaterials;
                                }
                            }
                        });
                        
                        if (addToScene) {
                            scene.add(object);
                            loadedModels.push(object);
                            loadedModel = object;
                            console.log(`✓ 模型加载成功: ${config.name}`);
                            
                            // 调试：输出模型结构信息
                            console.log('📦 模型结构分析:');
                            let meshCount = 0;
                            let transparentCount = 0;
                            let totalVertices = 0;
                            object.traverse((child) => {
                                if (child.isMesh) {
                                    meshCount++;
                                    const vertexCount = child.geometry?.attributes?.position?.count || 0;
                                    totalVertices += vertexCount;
                                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                                    mats.forEach(m => {
                                        if (m.transparent) transparentCount++;
                                        const colorHex = m.color ? '#' + m.color.getHexString() : 'N/A';
                                        console.log(`  - Mesh: "${child.name}" | 顶点: ${vertexCount} | Material: "${m.name}" | color: ${colorHex} | transparent: ${m.transparent}, opacity: ${m.opacity.toFixed(2)}, visible: ${child.visible}`);
                                    });
                                }
                            });
                            console.log(`📊 总计: ${meshCount} 个网格, ${totalVertices} 顶点, ${transparentCount} 个透明材质`);
                            
                            // 打印模型边界框，检查位置是否正确
                            const box = new THREE.Box3().setFromObject(object);
                            const size = new THREE.Vector3();
                            const center = new THREE.Vector3();
                            box.getSize(size);
                            box.getCenter(center);
                            console.log(`📐 边界框 - 中心: (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)}) | 尺寸: (${size.x.toFixed(2)}, ${size.y.toFixed(2)}, ${size.z.toFixed(2)})`);
                        }
                        
                        resolve(object);
                        
                    }, (xhr) => {
                        if (xhr.total > 0) {
                            const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                            loadingElem.innerText = `正在加载 ${config.name}... ${percent}%`;
                        } else {
                            loadingElem.innerText = `正在加载 ${config.name}... ${(xhr.loaded / 1024).toFixed(0)} KB`;
                        }
                    }, (error) => {
                        loadingElem.style.display = 'none';
                        console.error(`❌ 模型加载失败: ${config.name}`);
                        console.error(`   文件路径: ${modelPath}`);
                        console.error(`   错误信息:`, error);
                        alert(`模型加载失败: ${config.name}\n路径: ${modelPath}\n错误: ${error.message || error}`);
                        reject(error);
                    });
                }); // 闭合 .then()
            }); // 闭合 Promise
        }
        
        // 加载指定文件夹的纹理清单
        async function loadTextureListForModel(textureFolder) {
            try {
                // 尝试加载 textures.json
                const response = await fetch(`${textureFolder}/textures.json`);
                const textureFiles = await response.json();
                return textureFiles.map(file => ({
                    name: file,
                    path: `${textureFolder}/${file}`
                }));
            } catch (error) {
                if (DEBUG_MODE) console.warn(`⚠ ${textureFolder}/textures.json 不存在，将尝试自动匹配`);
                return [];
            }
        }
        
        // 在纹理列表中查找匹配 - 改进版智能匹配
        function findTextureInList(materialName, textures) {
            if (!materialName || textures.length === 0) return null;
            const matLower = materialName.toLowerCase();
            
            // 首先尝试精确匹配
            for (const tex of textures) {
                const texLower = tex.name.toLowerCase();
                if (texLower.includes(matLower) && texLower.includes('basecolor')) {
                    return tex.path;
                }
            }
            
            // 如果精确匹配失败，尝试模糊匹配
            // 提取材质名中的关键词
            const keywords = matLower.split(/[_\-\s]+/).filter(k => k.length > 2);
            
            for (const tex of textures) {
                const texLower = tex.name.toLowerCase();
                if (texLower.includes('basecolor') || texLower.includes('diffuse') || texLower.includes('albedo')) {
                    // 检查是否包含任何关键词
                    for (const keyword of keywords) {
                        if (texLower.includes(keyword)) {
                            if (DEBUG_MODE) console.log(`🔍 纹理模糊匹配: "${materialName}" -> "${tex.name}"`);
                            return tex.path;
                        }
                    }
                }
            }
            
            // 最后尝试返回任意一个 BaseColor 贴图作为默认
            const defaultTex = textures.find(tex => 
                tex.name.toLowerCase().includes('basecolor') || 
                tex.name.toLowerCase().includes('diffuse') ||
                tex.name.toLowerCase().includes('albedo')
            );
            
            if (defaultTex) {
                if (DEBUG_MODE) console.log(`🎨 使用默认纹理: "${materialName}" -> "${defaultTex.name}"`);
                return defaultTex.path;
            }
            
            return null;
        }

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0); // 设置旋转中心点为上方一点

        controls.update();

        // 第一视角控制
        const pointerLockControls = new PointerLockControls(camera, document.body);

        // 第一视角运动变量

        const fpDirection = new THREE.Vector3();

        // 第一视角切换函数
        function toggleFirstPerson() {
            firstPersonMode = !firstPersonMode;

                // 进入第一视角
                controls.enabled = false; // 禁用OrbitControls
                // 将 pointerLockControls 的对象位置与当前相机位置同步，然后请求锁定
                pointerLockControls.getObject().position.copy(camera.position);
                pointerLockControls.lock(); // 锁定鼠标
                // 设置相机到地面高度（第一视角）
                pointerLockControls.getObject().position.y = FP_EYE_HEIGHT; // 第一视角眼高

        // ==========================================

        let selectedObject = null;

        // 用于存储原始材质颜色（用于高亮效果）

        const transformControls = new TransformControls(camera, renderer.domElement);
        scene.add(transformControls);

        // 当使用 TransformControls 时，禁用 OrbitControls
        transformControls.addEventListener('dragging-changed', (event) => {
            controls.enabled = !event.value;

        // 鼠标点击选中模型
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', onMouseClick, false);

        function onMouseClick(event) {
            // 如果正在拖拽 TransformControls，不处理点击
            if (transformControls.dragging) return;
            
            // 如果处于观察模式，不处理点击选择
            if (viewMode === 'view') return;

            // 计算鼠标位置（归一化设备坐标）
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // 更新射线
            raycaster.setFromCamera(mouse, camera);

            // 只检测所有已加载模型中的可点击对象
            let intersectableObjects = [];
            loadedModels.forEach(model => {
                model.traverse((child) => {
                    if (child.isMesh) {
                        intersectableObjects.push(child);
                    }
                });
            });

            const intersects = raycaster.intersectObjects(intersectableObjects, false);

            if (intersects.length > 0) {
                // 选中对象 - 根据选择模式决定选择范围
                const clickedMesh = intersects[0].object;
                let targetObject;
                
                if (selectionMode === 'whole') {
                    // 整体模式：选择整个FBX模型
                    targetObject = clickedMesh;
                    while (targetObject.parent && targetObject.parent !== scene) {
                        targetObject = targetObject.parent;
                    }
                    if (DEBUG_MODE) console.log('✓ 已选中（整体模式）:', targetObject.name || '未命名对象');
                } else {
                    // 单个家具模式：选择单个家具组或mesh
                    targetObject = clickedMesh;
                    
                    // 查找该mesh属于哪个加载的模型
                    let parentModel = null;
                    for (const model of loadedModels) {
                        let found = false;
                        model.traverse(child => {
                            if (child === clickedMesh) found = true;
                        });
                        if (found) {
                            parentModel = model;
                            break;
                        }
                    }
                    
                    // 如果mesh的父级不是整个模型，选择父级（即单个家具组）
                    if (clickedMesh.parent && clickedMesh.parent !== parentModel && clickedMesh.parent !== scene) {
                        targetObject = clickedMesh.parent;
                    }
                    
                    if (DEBUG_MODE) console.log('✓ 已选中（单个家具）:', targetObject.name || '未命名对象', '| 类型:', targetObject.type);
                }
                
                selectObject(targetObject);
            } else {
                // 点击空白处取消选中
                deselectObject();
            }
        }

        function selectObject(object) {
            // 先取消之前的选中
            if (selectedObject) {
                deselectObject();
            }
            
            selectedObject = object;
            transformControls.attach(object);
            
            // 添加高亮效果
            object.traverse((child) => {
                if (child.isMesh && child.material) {
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    materials.forEach((mat, idx) => {
                        // 保存原始颜色
                        const key = `${child.uuid}_${idx}`;
                        if (!originalColors.has(key)) {
                            originalColors.set(key, {
                                emissive: mat.emissive ? mat.emissive.clone() : new THREE.Color(0x000000),
                                emissiveIntensity: mat.emissiveIntensity || 0
                            });
                        }
                        // 添加高亮（发光效果）
                        if (mat.emissive) {
                            mat.emissive.setHex(0x444400);
                            mat.emissiveIntensity = 0.3;
                        }
                    });
                }
            });
            
            if (DEBUG_MODE) console.log(`已选中对象，当前模式: ${transformControls.mode}`);
        }

        function deselectObject() {
            if (selectedObject) {
                // 恢复原始颜色
                selectedObject.traverse((child) => {
                    if (child.isMesh && child.material) {
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        materials.forEach((mat, idx) => {
                            const key = `${child.uuid}_${idx}`;
                            const original = originalColors.get(key);
                            if (original && mat.emissive) {
                                mat.emissive.copy(original.emissive);
                                mat.emissiveIntensity = original.emissiveIntensity;
                            }
                        });
                    }
                });
                
                transformControls.detach();
                selectedObject = null;
                if (DEBUG_MODE) console.log('✓ 已取消选中');
            }
        }

        // 键盘快捷键控制
        window.addEventListener('keydown', onKeyDown, false);

        function onKeyDown(event) {
            const key = event.key.toLowerCase();
            
            // 数字键：调整环境基准值
            if (key === '1') {
                event.preventDefault();
                tempBase += 1;
                document.getElementById('tempBase').textContent = tempBase.toFixed(1);
                console.log(`温度基准: ${tempBase}°C`);
                return;
            }
            if (key === '2') {
                event.preventDefault();
                tempBase -= 1;
                document.getElementById('tempBase').textContent = tempBase.toFixed(1);
                console.log(`温度基准: ${tempBase}°C`);
                return;
            }
            if (key === '3') {
                event.preventDefault();
                humBase += 1;
                document.getElementById('humBase').textContent = humBase;
                console.log(`湿度基准: ${humBase}%`);
                return;
            }
            if (key === '4') {
                event.preventDefault();
                humBase -= 1;
                document.getElementById('humBase').textContent = humBase;
                console.log(`湿度基准: ${humBase}%`);
                return;
            }
            if (key === '5') {
                event.preventDefault();
                pmBase += 1;
                document.getElementById('pmBase').textContent = pmBase;
                console.log(`PM2.5基准: ${pmBase}`);
                return;
            }
            if (key === '6') {
                event.preventDefault();
                pmBase -= 1;
                document.getElementById('pmBase').textContent = pmBase;
                console.log(`PM2.5基准: ${pmBase}`);
                return;
            }
            
            // V键：切换第一视角模式
            if (key === 'v') {
                event.preventDefault();
                toggleFirstPerson();
                return;
            }
            
            // Tab键：切换选择模式（仅编辑模式有效）
            if (event.key === 'Tab') {
                event.preventDefault();
                if (viewMode === 'edit') {
                    selectionMode = selectionMode === 'individual' ? 'whole' : 'individual';
                    selectionModeElem.textContent = selectionMode === 'individual' ? '单个家具' : '整体模型';
                    console.log(`切换选择模式: ${selectionMode === 'individual' ? '单个家具' : '整体模型'}`);
                    
                    // 切换模式时取消当前选中
                    deselectObject();
                }
                return;
            }
            
            // WASD 镜头移动控制（记录按键状态，在动画循环中处理）
            if (['w', 'a', 's', 'd'].includes(key) && (viewMode === 'view' || !selectedObject || firstPersonMode)) {
                event.preventDefault();
                keysPressed[key] = true;
                // 如果在第一视角, 同步第一视角移动标志
                if (firstPersonMode) {
                    if (key === 'w') fpMove.forward = true;
                    if (key === 's') fpMove.backward = true;
                    if (key === 'a') fpMove.left = true;
                    if (key === 'd') fpMove.right = true;
                }
                return;
            }
            
            if (!selectedObject || viewMode === 'view') return;

            switch (event.key.toLowerCase()) {
                case 'w': // 移动模式
                    transformControls.setMode('translate');
                    if (DEBUG_MODE) console.log('切换到移动模式 (W)');
                    break;
                case 'e': // 旋转模式
                    transformControls.setMode('rotate');
                    if (DEBUG_MODE) console.log('切换到旋转模式 (E)');
                    break;
                case 'r': // 缩放模式
                    transformControls.setMode('scale');
                    if (DEBUG_MODE) console.log('切换到缩放模式 (R)');
                    break;
                case 'escape': // 取消选中
                    deselectObject();
                    break;
                case 'delete': // 删除对象
                case 'backspace': // Mac 上的删除键
                    if (selectedObject) {
                        const toRemove = selectedObject;
                        transformControls.detach();

                        // 从父节点移除对象
                        if (toRemove.parent) toRemove.parent.remove(toRemove);
                        else scene.remove(toRemove);

                        // 递归释放资源
                        function disposeRecursively(obj) {
                            obj.traverse(child => {
                                if (child.isMesh) {
                                    if (child.geometry) child.geometry.dispose();
                                    if (child.material) {
                                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                                        mats.forEach(mat => {
                                            if (mat.map && mat.map.dispose) mat.map.dispose();
                                            if (mat.dispose) mat.dispose();
                                        });
                                    }
                                }
                            });
                        }
                        disposeRecursively(toRemove);

                        console.log('✓ 已删除对象:', toRemove.name || toRemove.uuid);

                        // 从 loadedModels 数组中移除
                        const idx = loadedModels.indexOf(toRemove);
                        if (idx > -1) loadedModels.splice(idx, 1);
                        
                        if (toRemove === loadedModel) loadedModel = null;
                        selectedObject = null;
                    }
                    break;
                case '+': // 放大
                case '=':
                    if (selectedObject) {
                        selectedObject.scale.multiplyScalar(1.1);
                        console.log('放大模型');
                    }
                    break;
                case '-': // 缩小
                case '_':
                    if (selectedObject) {
                        selectedObject.scale.multiplyScalar(0.9);
                        console.log('缩小模型');
                    }
                    break;
            }
        }

        // 辅助：下载 Blob
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // 辅助：下载字符串
        function downloadString(text, filename, type = 'application/json') {
            const blob = new Blob([text], { type });
            downloadBlob(blob, filename);
        }

        // 收集所有已加载模型的变换数据
        function collectAllTransforms() {
            const items = [];
            
            loadedModels.forEach(model => {
                // 调试输出
                console.log(`📍 保存模型: ${model.name}`);
                console.log(`   位置: (${model.position.x.toFixed(3)}, ${model.position.y.toFixed(3)}, ${model.position.z.toFixed(3)})`);
                console.log(`   缩放: (${model.scale.x.toFixed(4)}, ${model.scale.y.toFixed(4)}, ${model.scale.z.toFixed(4)})`);
                
                // 保存模型本身的变换
                const modelData = {
                    name: model.name || '',
                    configName: model.userData.config?.name || model.name,
                    position: [model.position.x, model.position.y, model.position.z],
                    rotation: [model.rotation.x, model.rotation.y, model.rotation.z],
                    quaternion: [model.quaternion.x, model.quaternion.y, model.quaternion.z, model.quaternion.w],
                    scale: [model.scale.x, model.scale.y, model.scale.z],
                    children: []
                };
                
                // 递归保存所有子对象的变换（包括深层嵌套的家具）
                function collectChildTransforms(parent, depth = 0) {
                    parent.children.forEach(child => {
                        if (child.visible && (child.isGroup || child.isMesh || child.isObject3D)) {
                            const childData = {
                                name: child.name || '',
                                type: child.type,
                                position: [child.position.x, child.position.y, child.position.z],
                                rotation: [child.rotation.x, child.rotation.y, child.rotation.z],
                                quaternion: [child.quaternion.x, child.quaternion.y, child.quaternion.z, child.quaternion.w],
                                scale: [child.scale.x, child.scale.y, child.scale.z],
                                children: []
                            };
                            
                            // 递归收集子对象
                            if (child.children && child.children.length > 0) {
                                collectChildTransforms(child, depth + 1).forEach(c => childData.children.push(c));
                            }
                            
                            modelData.children.push(childData);
                        }
                    });
                    return modelData.children;
                }
                
                collectChildTransforms(model);
                items.push(modelData);
            });
            
            return items;
        }

        // 保存场景状态到 JSON 并下载
        function saveTransforms() {
            const data = {
                timestamp: Date.now(),
                version: '2.0',  // 新版本格式
                modelCount: loadedModels.length,
                models: collectAllTransforms()
            };
            const json = JSON.stringify(data, null, 2);
            downloadString(json, 'scene_transforms.json', 'application/json');
            console.log(`✓ 已保存场景状态，包含 ${loadedModels.length} 个模型`);
        }

        // 从文件导入场景状态
        function loadTransformsFromFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function (e) {
                try {
                    const data = JSON.parse(e.target.result);
                    await applyTransformsData(data);
                    if (DEBUG_MODE) console.log('✓ 已导入场景状态');
                } catch (err) {
                    console.error('✗ 导入失败:', err);
                    alert('导入失败：' + err.message);
                }
            };
            reader.readAsText(file);
        }

        // 将导入的数据应用到场景
        async function applyTransformsData(data) {
            if (!data) return;
            
            // 新版本格式 (v2.0)
            if (data.version === '2.0' && Array.isArray(data.models)) {
                if (DEBUG_MODE) console.log(`📥 导入场景：${data.models.length} 个模型 (并行加载)`);
                else console.log(`加载场景: ${data.models.length} 个模型...`);
                
                // 清空当前场景中的所有模型
                while (loadedModels.length > 0) {
                    const model = loadedModels.pop();
                    scene.remove(model);
                }
                loadedModel = null;
                
                // 递归应用子对象的变换（提取为独立函数）
                function applyChildTransforms(parent, childrenData) {
                    if (!childrenData || childrenData.length === 0) return;
                    
                    childrenData.forEach(childData => {
                        // 通过名称查找子对象
                        let child = null;
                        parent.children.forEach(c => {
                            if (c.name === childData.name && !child) {
                                child = c;
                            }
                        });
                        
                        if (child) {
                            child.position.set(childData.position[0], childData.position[1], childData.position[2]);
                            child.scale.set(childData.scale[0], childData.scale[1], childData.scale[2]);
                            
                            if (childData.quaternion && childData.quaternion.length === 4) {
                                child.quaternion.set(childData.quaternion[0], childData.quaternion[1], childData.quaternion[2], childData.quaternion[3]);
                            } else if (childData.rotation) {
                                child.rotation.set(childData.rotation[0], childData.rotation[1], childData.rotation[2]);
                            }
                            
                            // 递归处理嵌套子对象
                            if (childData.children && childData.children.length > 0) {
                                applyChildTransforms(child, childData.children);
                            }
                            
                            child.updateMatrixWorld(true);
                        }
                    });
                }
                
                // 并行加载所有模型
                const loadStartTime = performance.now();
                const loadPromises = data.models.map(async (modelData, index) => {
                    // 查找对应的模型配置
                    const config = modelConfigs.find(c => c.name === modelData.configName);
                    if (!config) {
                        console.warn(`⚠ 找不到模型配置: ${modelData.configName}`);
                        return null;
                    }
                    
                    // 加载模型（跳过默认变换，因为我们要应用保存的变换）
                    try {
                        const object = await loadModel(config, true, true);  // skipDefaultTransform = true
                        
                        if (DEBUG_MODE) {
                            console.log(`📍 恢复模型: ${modelData.configName}`);
                            console.log(`   目标位置: (${modelData.position[0].toFixed(3)}, ${modelData.position[1].toFixed(3)}, ${modelData.position[2].toFixed(3)})`);
                            console.log(`   目标缩放: (${modelData.scale[0].toFixed(4)}, ${modelData.scale[1].toFixed(4)}, ${modelData.scale[2].toFixed(4)})`);
                        }
                        
                        // 应用保存的变换
                        object.position.set(modelData.position[0], modelData.position[1], modelData.position[2]);
                        object.scale.set(modelData.scale[0], modelData.scale[1], modelData.scale[2]);
                        
                        if (modelData.quaternion && modelData.quaternion.length === 4) {
                            object.quaternion.set(modelData.quaternion[0], modelData.quaternion[1], modelData.quaternion[2], modelData.quaternion[3]);
                        } else if (modelData.rotation) {
                            object.rotation.set(modelData.rotation[0], modelData.rotation[1], modelData.rotation[2]);
                        }
                        
                        // 应用子对象的变换
                        if (modelData.children && modelData.children.length > 0) {
                            applyChildTransforms(object, modelData.children);
                        }
                        
                        object.updateMatrixWorld(true);
                        
                        if (DEBUG_MODE) {
                            console.log(`   实际位置: (${object.position.x.toFixed(3)}, ${object.position.y.toFixed(3)}, ${object.position.z.toFixed(3)})`);
                            console.log(`✓ 已恢复模型: ${modelData.configName}`);
                        }
                        
                        return { object, index };
                    } catch (err) {
                        console.error(`✗ 加载模型失败: ${modelData.configName}`, err);
                        return null;
                    }
                });
                
                // 等待所有模型加载完成
                const results = await Promise.all(loadPromises);
                const loadEndTime = performance.now();
                const successCount = results.filter(r => r !== null).length;
                const loadTimeSeconds = ((loadEndTime - loadStartTime) / 1000).toFixed(2);
                console.log(`✅ 场景加载完成: ${successCount}/${data.models.length} 个模型，耗时 ${loadTimeSeconds} 秒`);
                console.log(`📊 缓存统计: ${modelCache.size} 个模型缓存, ${textureCache.size} 个纹理缓存`);
                
                return;
            }
            
            // 旧版本格式兼容 (v1.0)
            if (Array.isArray(data.items)) {
                console.log('📥 检测到旧版本格式，尝试兼容导入...');
                data.items.forEach(it => {
                    let obj = scene.getObjectByProperty('uuid', it.uuid);
                    if (!obj && it.name) obj = scene.getObjectByName(it.name);
                    if (obj) {
                        if (it.position) obj.position.fromArray(it.position);
                        if (it.quaternion) obj.quaternion.fromArray(it.quaternion);
                        else if (it.rotation) obj.rotation.set(it.rotation[0], it.rotation[1], it.rotation[2]);
                        if (it.scale) obj.scale.fromArray(it.scale);
                        obj.updateMatrixWorld(true);
                    } else {
                        console.warn('无法找到对象:', it.name || it.uuid);
                    }
                });
            }
        }

        // 导出 glTF（支持导出整个场景或选中对象）
        function exportGLTF(objects, binary = false) {
            if (!objects || (Array.isArray(objects) && objects.length === 0)) {
                alert('没有要导出的对象');
                return;
            }
            
            const exporter = new GLTFExporter();
            
            // 如果是数组，创建一个临时组来包含所有对象
            let exportTarget;
            if (Array.isArray(objects)) {
                exportTarget = new THREE.Group();
                exportTarget.name = 'ExportedScene';
                objects.forEach(obj => {
                    exportTarget.add(obj.clone());
                });
            } else {
                exportTarget = objects;
            }
            
            exporter.parse(exportTarget, function (result) {
                if (result instanceof ArrayBuffer) {
                    const blob = new Blob([result], { type: 'application/octet-stream' });
                    downloadBlob(blob, 'scene.glb');
                } else {
                    const json = JSON.stringify(result, null, 2);
                    downloadString(json, 'scene.gltf', 'application/json');
                }
                console.log('✓ glTF 导出成功');
            }, { binary });
        }

        // 模拟传感器数据：基于世界坐标 x,z 生成平滑可变值
        function sampleEnvironmentAt(x, z, now) {
            // 每秒更新一次随机噪声
            const currentSecond = Math.floor(now);
            if (currentSecond !== lastSecond) {
                lastSecond = currentSecond;
                cachedTempNoise = (Math.random() - 0.5) * 2 * tempNoiseRange;
                cachedHumNoise = (Math.random() - 0.5) * 2 * humNoiseRange;
                cachedPmNoise = (Math.random() - 0.5) * 2 * pmNoiseRange;
            }

            // 温度：基准 + 随机抖动，粒度0.1
            const temp = Math.round((tempBase + cachedTempNoise) * 10) / 10;

            // 湿度：基准 + 随机抖动
            const hum = Math.round(humBase + cachedHumNoise);

            // PM2.5：基准 + 随机抖动
            const pm = Math.round(pmBase + cachedPmNoise);

            return { temp, hum, pm };
        }

        function drawGauge(canvas, value, min, max, unit, color) {
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // 圆弧位置
            const cx = w / 2;
            const cy = h * 0.9;
            const r = Math.min(w, h) * 0.45;

            // 背景弧
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.arc(cx, cy, r, Math.PI, 2 * Math.PI, false);
            ctx.stroke();

            // 值弧
            const t = Math.max(0, Math.min(1, (value - min) / (max - min)));
            const end = Math.PI + t * Math.PI;
            ctx.strokeStyle = color;
            ctx.beginPath();
            ctx.arc(cx, cy, r, Math.PI, end, false);
            ctx.stroke();

            // 指针
            const ang = Math.PI + t * Math.PI;
            const px = cx + Math.cos(ang) * (r - 6);
            const py = cy + Math.sin(ang) * (r - 6);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(px, py);
            ctx.lineWidth = 3;
            ctx.stroke();

            // 文本
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${value}${unit}`, cx, cy - r * 0.45);
        }

            };

            // 监听 OrbitControls 的变化，动态输出
